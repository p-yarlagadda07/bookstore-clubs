name: ci
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --include=optional
      - run: npm run lint
      - run: npm test
      - run: npm run build
